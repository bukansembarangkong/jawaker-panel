# JAWAKER CI — Phase 0 baseline pipeline.
#
# Gates (IMPLEMENTATION_PLAN.md Phase 0, SECURITY.md s14, TESTING.md s2):
#   go       — format, vet, lint, unit tests, integration tests against a real
#              PostgreSQL service container, govulncheck
#   web      — lint, typecheck, tests, build, dependency audit
#   security — gitleaks full-history secret scan
#   artifacts — reproducible controller build + checksums + SBOMs
#
# Integration tests are NOT mocks (TESTING.md s4): the migrate suite runs
# against postgres:17 in this pipeline on every push.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  # proxy.golang.org intermittently returns 403 for some module fetches on
  # hosted runners; ",direct" falls back to the upstream VCS when that happens.
  # go.sum is still verified either way, so this adds resilience without
  # weakening supply-chain checks.
  GOPROXY: https://proxy.golang.org,direct

jobs:
  go:
    name: go (vet, lint, unit, integration, vuln)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jawaker
          POSTGRES_PASSWORD: ci_local_fixture_password
          POSTGRES_DB: jawaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jawaker -d jawaker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JAWAKER_TEST_DATABASE_URL: postgres://jawaker:ci_local_fixture_password@127.0.0.1:5432/jawaker_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: unit tests
        run: go test -race -shuffle=on -coverprofile=coverage-unit.out ./...

      - name: integration tests (real PostgreSQL)
        run: go test -race -tags integration -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage-unit.out
          retention-days: 14

  web:
    name: web (lint, typecheck, test, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test -- --run

      - name: build
        run: npm run build

      - name: dependency audit
        # High+ only: moderate advisories in transitive dev tooling must not
        # block the pipeline, but are reviewed via the weekly Dependabot run.
        run: npm audit --audit-level=high

      - name: upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14

  security:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: secrets in old commits must fail too

      # gitleaks CLI, pinned by version and verified by checksum, rather than
      # gitleaks/gitleaks-action: the action bundles a Node 20 runtime that
      # crashes on current GitHub runners (Node 24 forced), which made this
      # gate fail in ~5s without ever scanning. The CLI has no such coupling
      # and gives us deterministic, reproducible scan behaviour.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Download under the ORIGINAL asset name: the release checksum
          # manifest lists that name, and `sha256sum -c` resolves the file it
          # is asked to verify by the name recorded in the manifest.
          curl -sSfL -o "$asset" "${base}/${asset}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: scan history for secrets
        run: |
          set -euo pipefail
          # --redact keeps any finding out of the public log while still
          # failing the build. Scans the entire commit history (full clone).
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  distro:
    name: distro matrix (node agent)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # Runs the SAME script a developer runs locally, so a certified result
      # cannot diverge from what is reproducible. Each row pins its image by
      # digest (docs/distro-matrix.md): that is what makes the evidence apply to
      # a specific image rather than to whatever a tag points at today.
      - name: validate distro matrix
        run: ./scripts/distro-matrix.sh --arch amd64

  artifacts:
    name: build artifacts, checksums, SBOM
    runs-on: ubuntu-24.04
    needs: [go, web, security, distro]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: read version
        id: meta
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: build controller (reproducible flags)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/bukansembarangkong/jawaker-panel/internal/version.Version=${VERSION} \
              -X github.com/bukansembarangkong/jawaker-panel/internal/version.Commit=${COMMIT} \
              -X github.com/bukansembarangkong/jawaker-panel/internal/version.BuildTime=${BUILD_TIME}" \
            -o dist/jawaker-controller ./cmd/controller
          ./dist/jawaker-controller -h 2>&1 | head -n 3 || true

      - name: build node agent (linux amd64 + arm64)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          # The node agent is a separate binary for a separate host, so it is
          # cross-compiled rather than built once for the runner. CGO_ENABLED=0 is
          # what makes that a pure-Go build with no libc to match, and -trimpath
          # keeps the paths reproducible.
          #
          # Service operations are Linux-only in the agent (see
          # internal/nodeagent/procattr_other.go), so only Linux targets are
          # produced: shipping a darwin or windows agent would advertise a
          # capability the agent refuses.
          ldflags="-s -w \
            -X github.com/bukansembarangkong/jawaker-panel/internal/version.Version=${VERSION} \
            -X github.com/bukansembarangkong/jawaker-panel/internal/version.Commit=${COMMIT} \
            -X github.com/bukansembarangkong/jawaker-panel/internal/version.BuildTime=${BUILD_TIME}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "dist/jawaker-node-agent-linux-$arch" ./cmd/node-agent
          done
          ls -l dist/jawaker-node-agent-*

      - name: verify each artifact reports its version
        run: |
          # A build that succeeds but produces a binary whose version metadata was
          # not injected is indistinguishable from a good one until an operator
          # reads the version. Both binaries expose `version` for exactly this, so
          # a failure here fails the job rather than passing silently.
          echo "controller: $(./dist/jawaker-controller version)"
          echo "agent:      $(./dist/jawaker-node-agent-linux-amd64 version)"

      - name: checksums
        run: |
          cd dist
          sha256sum jawaker-controller jawaker-node-agent-linux-amd64 jawaker-node-agent-linux-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: go SBOM (cyclonedx)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output dist/sbom-go.cdx.json

      - name: web SBOM (cyclonedx)
        working-directory: apps/web
        run: |
          # cyclonedx-npm builds the SBOM from the installed dependency tree
          # (npm-ls), so the lockfile must be materialized first.
          npm ci --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../../dist/sbom-web.cdx.json --output-format JSON

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jawaker-dist-${{ steps.meta.outputs.commit }}
          path: dist/
          retention-days: 30
